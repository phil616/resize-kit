[project]
name = "resize-kit"
version = "0.1.0"
description = "Enterprise multi-format lossy compressor with precise size targeting (images, audio, video, Office, PDF)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "phil616", email = "phil616@163.com" }]
keywords = ["compression", "image", "video", "audio", "pdf", "office", "ffmpeg"]

dependencies = [
    "Pillow>=10.2",
    "PyMuPDF>=1.24",
    "pikepdf>=8.0",
    "PyQt5>=5.15",
]

[project.urls]
Repository = "https://github.com/phil616/resize-kit"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
resize-kit = "resize_kit.cli:main"

[project.gui-scripts]
resize-kit-gui = "resize_kit.gui.__main__:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv]
# PyQt5-Qt5 publishes platform-specific wheels under *diverging* version numbers
# (Linux/macOS reach 5.15.x while Windows tops out at an earlier wheel). Declaring
# the target environments forces uv to produce a universal lock that selects a
# wheel-compatible PyQt5-Qt5 version *per platform*, so `uv sync` works on Windows,
# Linux and macOS from the same committed lockfile.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.build-backend]
module-name = "resize_kit"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "external: tests that require external binaries (ffmpeg/soffice/gs)",
    "gui: tests that require a Qt display",
]

[tool.ruff]
line-length = 100
target-version = "py310"
